name: Deploy YUHA CARE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect public web files and letter artwork
        run: |
          set -euo pipefail
          mkdir -p public-site/assets
          cp index.html design.css mental.css mental.js mental-diagnostics.js bridge-client.js config.js public-site/
          cp assets/mental-letter-sealed.svg assets/mental-letter-opened.svg public-site/assets/
      - name: Verify artwork paths and integrity before publishing
        run: |
          set -euo pipefail
          node --check public-site/mental.js
          node --check public-site/mental-diagnostics.js
          node --check public-site/bridge-client.js
          node tests/mental-diagnostics.test.js
          node tests/mental-server-conflicts.test.js
          cp apps-script/Code.gs /tmp/yuha-apps-script-check.js
          node --check /tmp/yuha-apps-script-check.js
          grep -q 'mental-diagnostics.js?v=' public-site/index.html
          grep -q 'function getMentalAuditLog' apps-script/Code.gs
          grep -q 'function reportMentalClientEvents' apps-script/Code.gs
          grep -q 'CLOUD_READBACK_OK' public-site/mental.js
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('public-site')
          page = (root / 'index.html').read_text(encoding='utf-8')
          script = (root / 'mental.js').read_text(encoding='utf-8')
          for name in ('mental-letter-sealed.svg', 'mental-letter-opened.svg'):
              relative = 'assets/' + name
              asset = root / relative
              if not asset.is_file() or asset.stat().st_size < 512:
                  raise SystemExit(f'Missing or empty deployed SVG: {relative}')
              ET.parse(asset)
              if relative not in script:
                  raise SystemExit(f'Artwork not referenced by frontend: {relative}')
          if 'mental.js?v=' not in page or 'mental.css?v=' not in page:
              raise SystemExit('Frontend asset cache paths missing from index.html')
          print('PASS: frontend JS, both deployed envelope SVGs, and asset URLs')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published envelope artwork
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          for name in mental-letter-sealed.svg mental-letter-opened.svg; do
            url="${base%/}/assets/${name}?deploy=${GITHUB_SHA}"
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 10 --retry-delay 5 --retry-all-errors \
              --connect-timeout 12 --max-time 20 --output "$tmp" "$url"
            grep -q '<svg' "$tmp" || { echo "Invalid deployed SVG: $url"; exit 1; }
            echo "PASS deployed SVG: $url ($(wc -c < "$tmp") bytes)"
            rm -f "$tmp"
          done
          diagurl="${base%/}/mental-diagnostics.js?deploy=${GITHUB_SHA}"
          diagtmp="$(mktemp)"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors \
            --connect-timeout 12 --max-time 20 --output "$diagtmp" "$diagurl"
          grep -q 'window.YuhaMentalDiagnostics' "$diagtmp" || { echo "Missing published device diagnostics"; exit 1; }
          echo "PASS published device diagnostic script ($(wc -c < "$diagtmp") bytes)"
          rm -f "$diagtmp"

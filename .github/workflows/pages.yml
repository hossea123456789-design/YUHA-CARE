name: Deploy YUHA CARE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect only public web files
        run: |
          mkdir -p public-site
          cp index.html design.css bridge-client.js config.js public-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy YUHA CARE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect public web files and letter artwork
        run: |
          set -euo pipefail
          mkdir -p public-site/assets
          cp index.html design.css mental.css mental.js bridge-client.js config.js recovery-comfort-1000.js public-site/
          cp assets/mental-letter-sealed.svg assets/mental-letter-opened.svg public-site/assets/
      - name: Verify artwork paths and integrity before publishing
        run: |
          set -euo pipefail
          node --check public-site/mental.js
          node --check public-site/recovery-comfort-1000.js
          node - <<'JS'
          const fs = require('fs'), vm=require('vm');
          const src=fs.readFileSync('public-site/recovery-comfort-1000.js','utf8');
          const ctx={window:{}}; vm.runInNewContext(src,ctx);
          const lib=ctx.window.YuhaCareComfortLibrary,rows=lib?.quotes;
          if(!Array.isArray(rows)||rows.length!==1000)throw Error('Expected exactly 1000 sourced empathy lines');
          if(new Set(rows.map(x=>x.text.replace(/\\s/g,''))).size!==1000)
            throw Error('Duplicate empathy messages');
          if(rows.some(x=>!x.sourceDialogue||x.text.length<20||x.text.length>160))
            throw Error('Bad provenance or abnormal line length');
          const html=fs.readFileSync('public-site/index.html','utf8');
          if(!html.includes('src="recovery-comfort-1000.js?'))
            throw Error('Missing daily empathy quote script in HTML');
          if(!lib.license||!lib.sourceUrl)throw Error('Missing quote licensing metadata');
          console.log('PASS 1,000 distinct licensed source passages and HTML wiring');
          JS
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('public-site')
          page = (root / 'index.html').read_text(encoding='utf-8')
          script = (root / 'mental.js').read_text(encoding='utf-8')
          for name in ('mental-letter-sealed.svg', 'mental-letter-opened.svg'):
              relative = 'assets/' + name
              asset = root / relative
              if not asset.is_file() or asset.stat().st_size < 512:
                  raise SystemExit(f'Missing or empty deployed SVG: {relative}')
              ET.parse(asset)
              if relative not in script:
                  raise SystemExit(f'Artwork not referenced by frontend: {relative}')
          if 'mental.js?v=' not in page or 'mental.css?v=' not in page:
              raise SystemExit('Frontend asset cache paths missing from index.html')
          print('PASS: frontend JS, both deployed envelope SVGs, and asset URLs')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published envelope artwork
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          for name in mental-letter-sealed.svg mental-letter-opened.svg; do
            url="${base%/}/assets/${name}?deploy=${GITHUB_SHA}"
            tmp="$(mktemp)"
            curl --fail --silent --show-error --location \
              --retry 10 --retry-delay 5 --retry-all-errors \
              --connect-timeout 12 --max-time 20 --output "$tmp" "$url"
            grep -q '<svg' "$tmp" || { echo "Invalid deployed SVG: $url"; exit 1; }
            echo "PASS deployed SVG: $url ($(wc -c < "$tmp") bytes)"
            rm -f "$tmp"
          done
          quoteurl="${base%/}/recovery-comfort-1000.js?deploy=${GITHUB_SHA}"
          quotetmp="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 5 --retry-all-errors \
            --connect-timeout 12 --max-time 20 --output "$quotetmp" "$quoteurl"
          grep -q 'window.YuhaCareComfortLibrary' "$quotetmp" || { echo "Missing published quote library"; exit 1; }
          echo "PASS published 1,000-line comfort library ($(wc -c < "$quotetmp") bytes)"
          rm -f "$quotetmp"

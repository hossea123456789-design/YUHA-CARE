    function openNap2Popover(anchor,dateKey) {
      if(nap2Popup?.dataset.date===dateKey) {closeNap2Popover();return;}
      closeNap2Popover();
      const rec=getSleepRecord(dateKey);
      const panel=document.createElement("section");
      panel.className="sleep-nap-popover";
      panel.setAttribute("role","dialog");
      panel.setAttribute("aria-label",dateKey+" 2차 낮잠 시간");
      panel.dataset.date=dateKey;
      const hasRecord=!!(rec.nap2Start||rec.nap2End);
      panel.innerHTML=
        '<div class="nap-popover-heading"><strong>2차 낮잠</strong><button type="button" class="nap-popover-close" aria-label="닫기">×</button></div>'+
        '<div class="nap-popover-times">'+
          '<div class="nap-popover-time"><span>시작</span><button type="button" class="nap2-start sleep-time-btn'+(rec.nap2Start?' filled':'')+'">'+(rec.nap2Start||'시각 선택')+'</button></div>'+
          '<div class="nap-popover-time"><span>종료</span><button type="button" class="nap2-end sleep-time-btn'+(rec.nap2End?' filled':'')+'">'+(rec.nap2End||'시각 선택')+'</button></div>'+
        '</div>'+
        '<p class="nap-popover-hint">시각을 누르면 다른 수면 기록과 동일한 시간 선택창이 열립니다.</p>'+
        '<div class="nap-popover-actions">'+
          (hasRecord?'<button type="button" class="nap-popover-delete">기록 삭제</button>':'<span></span>')+
          '<button type="button" class="nap-popover-close-action">닫기</button>'+
        '</div>';
      document.body.appendChild(panel);
      nap2Popup=panel;
      anchor.setAttribute("aria-expanded","true");
      const box=anchor.getBoundingClientRect();
      const w=panel.offsetWidth,h=panel.offsetHeight;
      const left=Math.min(Math.max(9,box.left+box.width/2-w/2),Math.max(9,window.innerWidth-w-9));
      const below=window.innerHeight-box.bottom>=h+15;

      panel.style.left=Math.round(left)+"px";
      panel.style.top=Math.round(top)+"px";

        nap2ReturnDate=dateKey;

      panel.querySelector(".nap-popover-close-action").addEventListener("click",closeNap2Popover);

      panel.addEventListener("keydown",ev=>{
        if(ev.key==="Escape"){ev.preventDefault();nap2ReturnDate=null;closeNap2Popover();anchor.focus();}
      });

    function reopenNap2Popover(dateKey) {
      if(!dateKey||currentTab!=="sleep")return;
      requestAnimationFrame(()=>{
        const row=document.querySelector('.sleep-table tr[data-date="'+dateKey+'"]');

        if(btn && !nap2Popup)openNap2Popover(btn,dateKey);

      if(nap2Popup&&!nap2Popup.contains(ev.target)&&!ev.target.closest(".sleep-nap-toggle"))closeNap2Popover();
    },true);
    
    function makeSleepTimeButton(dateKey,field,value,label) {
      const b=document.createElement("button");b.type="button";
      b.className="sleep-time-btn"+(value?" filled":"");
      b.textContent=value || "+";b.setAttribute("aria-label",`${dateKey} ${label} ${value||"미입력"}`);
      b.addEventListener("click",()=>openSleepTimeModal(dateKey,field));
      return b;
    }

    let sleepEditing=null;
    const sleepFieldLabels={bedTime:"침대 입실",asleepTime:"실제 잠듦",napStart:"1차 낮잠 시작",napEnd:"1차 낮잠 종료",nap2Start:"2차 낮잠 시작",nap2End:"2차 낮잠 종료",wakeTime:"기상 · 당일 아침"};
    function openSleepTimeModal(dateKey,field) {
      sleepEditing={dateKey,field};
      const row=getSleepRecord(dateKey);
      document.getElementById("sleepModalTitle").textContent=sleepFieldLabels[field];
      document.getElementById("sleepModalDate").textContent=`${dateKey} (${DAY_NAMES[new Date(dateKey+"T12:00:00").getDay()]}) · ${field==="wakeTime"?"이날 아침":field==="napStart"||field==="napEnd"||field==="nap2Start"||field==="nap2End"?"이날 낮": "이날 밤"}`;
      document.getElementById("sleepModalInput").value=row[field]||({bedTime:"19:30",asleepTime:"20:00",napStart:"12:30",napEnd:"14:00",nap2Start:"15:00",nap2End:"16:00",wakeTime:"06:30"}[field]);
      document.getElementById("sleepTimeModal").classList.add("show");
    }
    function closeSleepTimeModal(){
      sleepEditing=null;
      nap2ReturnDate=null;
      document.getElementById("sleepTimeModal").classList.remove("show");
    }
    function applySleepTimeModal(clear) {
      if(!sleepEditing)return;
      const {dateKey,field}=sleepEditing;
      const value=clear?"":document.getElementById("sleepModalInput").value;
      if(!clear && !/^([01]\d|2[0-3]):[0-5]\d$/.test(value)) {alert("시간을 선택해 주세요.");return;}
      if(!clear && (field==="nap2Start"||field==="nap2End")) {
        const record=getSleepRecord(dateKey);
        const start=sleepMinutes(field==="nap2Start"?value:record.nap2Start);
        const end=sleepMinutes(field==="nap2End"?value:record.nap2End);
        const firstEnd=sleepMinutes(record.napEnd);
        if(start!==null&&firstEnd!==null&&start<firstEnd){
          alert("2차 낮잠은 1차 낮잠이 끝난 뒤 시작해야 합니다.");return;
        }
        if(start!==null&&end!==null&&(end<=start||end-start>360)){
          alert("2차 낮잠 종료는 시작보다 늦어야 하며, 6시간 이내여야 합니다.");return;
        }
      }
      const returnDate=nap2ReturnDate;
      closeSleepTimeModal();
      updateSleepField(dateKey,field,value);
      drawSleepTable();drawSleepCalendar();updateSleepSummaries();
      if(returnDate)setTimeout(()=>reopenNap2Popover(returnDate),0);
    }

    function updateSleepSummaries() {
      if(currentTab!=="sleep")return;
      const dates=sleepViewMode==="week"?getSleepWeekDates(sleepSelectedDate):sleepDateKeys(sleepViewYear,sleepViewMonth);
      const rows=dates.map(getSleepRecord);
      const totals=dates.map(k=>getSleepQuality(k).total).filter(v=>v!==null);
      const nights=dates.map(nightDuration).filter(v=>v!==null);
      const naps=rows.map(napDuration).filter(v=>v!==null);
      const avg=values=>values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length):null;
      const complete=totals.length;
      document.getElementById("sleepSummary").innerHTML=[
        ["평균 총수면",formatDuration(avg(totals)),`${complete}일 기준`],
        ["평균 밤잠",formatDuration(avg(nights)),`${nights.length}일 기준`],
        ["평균 낮잠",formatDuration(avg(naps)),`${naps.length}일 기준`]
      ].map(([label,val,desc])=>`<div class="sleep-kpi"><div class="sleep-kpi-label">${label}</div><div class="sleep-kpi-value">${val}</div><div class="sleep-kpi-detail">${desc}</div></div>`).join("");
      const totalBrief=avg(totals);
      document.getElementById("summary").textContent=totalBrief!==null?`수면 기록 · 평균 총수면 ${formatDuration(totalBrief)}`:"수면 기록 · 자동 저장";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value);
    }

    document.getElementById("resetCurrentBtn").addEventListener("click", resetCurrentTab);
    document.getElementById("resetAllBtn").addEventListener("click", resetAllTabs);
    document.getElementById("cancelEditBtn").addEventListener("click", closeEditModal);
    document.getElementById("saveEditBtn").addEventListener("click", saveEdit);

    document.getElementById("editInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") saveEdit();
      if (event.key === "Escape") closeEditModal();
    });

    document.getElementById("editModal").addEventListener("click", (event) => {
      if (event.target.id === "editModal") closeEditModal();
    });

    document.getElementById("sleepModalCancel").addEventListener("click",closeSleepTimeModal);
    document.getElementById("sleepModalSave").addEventListener("click",()=>applySleepTimeModal(false));
    document.getElementById("sleepModalClear").addEventListener("click",()=>applySleepTimeModal(true));
    document.getElementById("sleepModalInput").addEventListener("keydown",event=>{if(event.key==="Enter")applySleepTimeModal(false);if(event.key==="Escape")closeSleepTimeModal();});
    document.getElementById("sleepTimeModal").addEventListener("click",event=>{if(event.target.id==="sleepTimeModal")closeSleepTimeModal();});

    document.getElementById("sleepConflictCancel").addEventListener("click",closeSleepConflicts);
    document.getElementById("sleepConflictApply").addEventListener("click",applySleepConflictChoices);
    loadFromServer();
    window.addEventListener("online", () => {
      if (data) loadFromServer();
    });
    // 기기 저장분은 서버 정보를 먼저 확인한 뒤 안전하게 병합합니다.
  </script>
</body>
</html>
